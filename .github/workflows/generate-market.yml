name: Generate Market Index
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Generate JSON
        run: python tools/generator.py
      - name: Commit and Push
        run: |
          git config --global user.name 'Market Bot'
          git config --global user.email 'bot@sshcommander.com'
          git add market.json
          git commit -m "chore: update market.json [skip ci]" || echo "No changes to commit"
          git push
